name: Deploy App to production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Prepare temporary environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Generate route cache
        run: php artisan route:cache || echo "⚠️ Route cache failed"

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Remove temporary .env
        run: rm -f .env

      - name: Configure SSH
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files (rsync)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          rsync -rlz --checksum --delete --omit-dir-times \
            -e "sshpass -e ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='.agents' \
            --exclude='node_modules' --exclude='tests' \
            --exclude='resources/js' --exclude='resources/css' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='storage/' --exclude='public/storage' \
            --exclude='database/*.sqlite' \
            --exclude='.mcp.json' --exclude='AGENTS.md' --exclude='boost.json' --exclude='components.json' \
            --exclude='package.json' --exclude='package-lock.json' --exclude='pnpm-workspace.yaml' \
            --exclude='tsconfig.json' --exclude='vite.config.ts' \
            --exclude='phpunit.xml' --exclude='phpstan.neon' --exclude='pint.json' \
            --exclude='.editorconfig' --exclude='.gitattributes' --exclude='.npmrc' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Post-deploy commands
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             php8.5 artisan migrate --force && \
             php8.5 artisan config:cache && \
             php8.5 artisan view:cache && \
             php8.5 artisan event:cache && \
             php8.5 artisan queue:restart"