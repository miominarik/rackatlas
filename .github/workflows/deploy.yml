name: Deploy App to FTP production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Prepare a temporary environment for the build
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Generate route cache
        run: php artisan route:cache || echo "⚠️ Route cache failed"

      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Remove files the server does not need
        run: |
          rm -rf .git .github .claude .agents node_modules tests
          rm -rf resources/js resources/css storage/logs database/*.sqlite
          rm -f .env .env.* .mcp.json AGENTS.md boost.json components.json
          rm -f package.json package-lock.json pnpm-workspace.yaml tsconfig.json vite.config.ts
          rm -f phpunit.xml phpstan.neon pint.json .editorconfig .gitattributes .npmrc

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          exclude: |
            node_modules/**
            .git/**
            .github/**
            tests/**
            storage/logs/**
            .env*